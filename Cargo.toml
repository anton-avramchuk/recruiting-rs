[workspace]
resolver = "2"
members = ["crates/*", "services/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "migrate", "macros"] }
jsonwebtoken = "9"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
base64 = "0.22"
rand = "0.8"
argon2 = "0.5"
sha2 = "0.10"
async-trait = "0.1"
utoipa = { version = "5", features = ["uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Argon2 в debug-сборке слишком медленный для тестов
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
