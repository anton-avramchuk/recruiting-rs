[package]
name = "web-crm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "web-crm"
path = "src/main.rs"
required-features = ["ssr"]

[features]
ssr = [
    "ui-kit/ssr",
    "ui-data/ssr",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
]
hydrate = [
    "ui-kit/hydrate",
    "ui-data/hydrate",
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
]

[dependencies]
ui-kit = { path = "../../crates/ui-kit" }
ui-data = { path = "../../crates/ui-data" }
candidate-contracts = { path = "../../crates/candidate-contracts" }
client-contracts = { path = "../../crates/client-contracts" }
comment-contracts = { path = "../../crates/comment-contracts" }
recruitment-contracts = { path = "../../crates/recruitment-contracts" }
grid-contracts = { path = "../../crates/grid-contracts" }
candidate-import = { path = "../../crates/candidate-import" }
serde.workspace = true
serde_json.workspace = true
# без v4: приложение собирается и в wasm
uuid = { version = "1", default-features = false, features = ["serde"] }
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
axum = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# DataTransfer нужен для перетаскивания карточек (Firefox требует данные в dragstart)
web-sys = { version = "0.3", features = ["DataTransfer", "HtmlElement", "Element", "Document", "File", "FileList", "Blob", "HtmlInputElement"] }

[lints]
workspace = true
