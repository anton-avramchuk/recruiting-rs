[package]
name = "ui-kit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:reqwest",
]
hydrate = [
    "leptos/hydrate",
    "dep:reqwest",
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:send_wrapper",
]

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
# будущие запросы fetch в wasm не Send, а Resource требует Send: браузер однопоточный
send_wrapper = { version = "0.6", optional = true, features = ["futures"] }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { version = "0.3", optional = true, features = ["Document", "Element", "FormData", "HtmlFormElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "MediaQueryList", "Storage", "Window"] }

[lints]
workspace = true
